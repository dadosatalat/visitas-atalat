<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atalat — Gestão Integrada de Visitas a Produtores</title>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #1E5E3A;
      --primary-hover: #16482C;
      --primary-light: #EBF5EE;
      --ink: #0F2942;
      --ink-light: #334E68;
      --muted: #627D98;
      --bg: #F4F7FB;
      --card-bg: #FFFFFF;
      --line: #D9E2EC;
      --line-light: #E8EEF5;
      --gold: #C9922B;
      --gold-light: #FEF7E6;
      --danger: #BA2525;
      --danger-light: #FFE8E8;
      --blue: #1D6FB8;
      --blue-light: #E6F0FA;
      --purple: #5A3E85;
      --purple-light: #F2ECFA;
      --amber: #D97706;
      --amber-light: #FEF3C7;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 3px rgba(15, 41, 66, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 41, 66, 0.09);
      --shadow-lg: 0 10px 25px rgba(15, 41, 66, 0.12);
      --accent: var(--primary);
    }
    
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    h1, h2, h3, .brand, .name { font-family: Georgia, serif; }
    h1 { font-size: 30px; margin: 0 0 4px; color: var(--ink); }
    h2 { font-size: 23px; margin: 0 0 12px; color: var(--ink); }
    h3 { font-size: 17px; margin: 0 0 10px; color: var(--ink); }
    
    button, input, textarea, select { font: inherit; }
    
    button {
      cursor: pointer;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease-in-out;
    }
    button:hover { background: #f8fafc; border-color: #bcccdc; }
    button:active { transform: scale(0.98); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    
    .primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(30, 94, 58, 0.2);
    }
    .primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }
    
    .secondary {
      background: var(--blue-light);
      color: var(--blue);
      border-color: #c2daf2;
      font-weight: 600;
    }
    .secondary:hover { background: #d7e8f8; }
    
    .dark {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
      font-weight: 600;
    }
    .dark:hover { background: var(--ink-light); }
    
    .ghost {
      border: 0;
      background: transparent;
      padding: 7px 10px;
      color: var(--muted);
    }
    .ghost:hover { background: var(--line-light); color: var(--ink); }
    
    .danger-btn {
      color: var(--danger);
      border-color: #f7c5c5;
      background: var(--danger-light);
    }
    .danger-btn:hover { background: #ffdada; border-color: var(--danger); }
    
    .wrap {
      max-width: 1050px;
      margin: auto;
      padding: 32px 20px 80px;
    }
    
    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    
    .brand {
      color: var(--primary);
      font-weight: bold;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 13px;
    }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .bold { font-weight: 600; }
    
    .logo {
      width: 155px;
      max-width: 42vw;
      height: auto;
      display: block;
      margin-bottom: 12px;
    }
    .print-logo { width: 125px; }
    
    /* Pills & Badges */
    .cloud-pill {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: white;
      transition: all 0.2s;
    }
    .cloud-pill:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--primary);
    }
    .cloud-online { background: #E1F7E8; color: #0E5A33; border-color: #A3E3B9; }
    .cloud-offline { background: #FFF7D6; color: #785200; border-color: #F7E07E; }
    .cloud-syncing { background: #E6F0FA; color: #104C82; border-color: #B5D4F5; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 20px;
      background: white;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    
    /* Login Page */
    .login-container {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #F4F7FB 0%, #E8F2EB 100%);
    }
    .login-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      max-width: 440px;
      width: 100%;
      padding: 36px 30px;
      text-align: center;
    }
    .login-tabs {
      display: flex;
      border-bottom: 2px solid var(--line-light);
      margin: 20px 0 24px;
    }
    .login-tab {
      flex: 1;
      padding: 10px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      border-radius: 0;
    }
    .login-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Stats Top Bar */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 18px 0 22px;
    }
    .stat-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
    }
    .stat-card strong {
      display: block;
      font-size: 24px;
      color: var(--primary);
      font-weight: 700;
      font-family: Georgia, serif;
    }
    .stat-card span {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 16px 0;
    }
    
    .filter-bar {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search-input-wrap {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-input-wrap input {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .search-input-wrap .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    
    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-pill {
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .filter-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .filter-pill span {
      opacity: 0.85;
      font-size: 11px;
      margin-left: 4px;
    }
    
    .filter-dropdowns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px;
    }
    .filter-dropdowns select {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      background: white;
      color: var(--ink);
    }
    
    .cards {
      display: grid;
      gap: 14px;
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: #bcccdc;
    }
    .card-main { flex: 1; min-width: 260px; }
    .card .name {
      font-size: 20px;
      font-weight: bold;
      margin: 6px 0 4px;
      color: var(--ink);
    }
    .card-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-draft { background: #FEF3C7; color: #92400E; }
    .badge-done { background: #D1FAE5; color: #065F46; }
    .badge-pending { background: #FEF3C7; color: #B45309; }
    .badge-admin { background: #E0E7FF; color: #3730A3; }
    
    .empty {
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      text-align: center;
      padding: 50px 20px;
      background: white;
    }
    
    .pick {
      width: 100%;
      text-align: left;
      display: block;
      padding: 18px 20px;
      margin: 12px 0;
      border-radius: var(--radius);
      background: white;
      border: 1px solid var(--line);
      transition: all 0.15s ease;
    }
    .pick:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    
    /* Wizard Form Layout */
    .layout {
      display: flex;
      min-height: 100vh;
      background: white;
    }
    .sidebar {
      width: 290px;
      flex: none;
      border-right: 1px solid var(--line);
      padding: 30px 20px;
      background: #FAFCFE;
    }
    .sidebar .progress-wrap {
      margin: 16px 0;
      background: var(--line-light);
      border-radius: 10px;
      height: 7px;
      overflow: hidden;
    }
    .sidebar .progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .step {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      border: 0;
      background: none;
      text-align: left;
      padding: 9px 8px;
      font-size: 13px;
      border-radius: var(--radius-sm);
      margin-bottom: 4px;
    }
    .step:hover { background: #EDF2F7; }
    .step strong {
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      flex: none;
      font-size: 12px;
      background: white;
    }
    .step.active {
      background: #E8F0F8;
      font-weight: 600;
      color: var(--ink);
    }
    .step.active strong {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    
    .formpane {
      width: min(730px, 100%);
      padding: 35px 36px 90px;
    }
    .mobile-steps {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .mobile-steps button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      font-size: 13px;
    }
    
    .field {
      margin-bottom: 22px;
      text-align: left;
    }
    .field > label, .field > legend {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      line-height: 1.45;
      color: var(--ink);
      font-size: 14px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--primary);
    }
    .field textarea {
      min-height: 88px;
      resize: vertical;
    }
    .field fieldset {
      border: 0;
      padding: 0;
      margin: 0;
    }
    .field-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      display: block;
    }
    .field-addon-btn {
      margin-top: 6px;
      font-size: 12px;
      padding: 5px 10px;
      background: var(--blue-light);
      color: var(--blue);
      border-color: #c8def4;
    }
    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-input-wrap input {
      padding-right: 42px !important;
    }
    .password-toggle-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      user-select: none;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    .password-toggle-btn:hover {
      background: #EDF2F7;
      color: var(--ink);
    }
    
    .choices {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .choice {
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .choice:hover { background: #f1f5f9; }
    .choice.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }
    
    .nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line-light);
      flex-wrap: wrap;
    }
    .nav > div {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    /* Report Layout */
    .report {
      max-width: 860px;
      margin: auto;
      padding: 36px 24px 80px;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
    }
    .report-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .report-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 20px 0;
      background: #F8FAFC;
      border-radius: var(--radius-sm);
      padding: 14px;
      border: 1px solid var(--line-light);
    }
    .report-summary-item strong {
      display: block;
      font-size: 16px;
      color: var(--ink);
    }
    .report-summary-item span {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .report-section {
      margin: 26px 0;
      break-inside: avoid;
    }
    .report-section h3 {
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      color: var(--primary);
      font-size: 17px;
    }
    .report-row {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      padding: 9px 4px;
      border-bottom: 1px solid #f0f4f8;
      font-size: 14px;
    }
    .report-row:nth-child(even) { background: #fafcff; }
    .report-row span:first-child {
      color: var(--muted);
      max-width: 55%;
      font-weight: 500;
    }
    .report-row span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
      font-weight: 550;
      color: var(--ink);
    }
    
    .signatures-block {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px dashed var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      break-inside: avoid;
    }
    .sig-line {
      text-align: center;
      padding-top: 40px;
      border-top: 1px solid var(--ink);
      font-size: 13px;
      color: var(--muted);
    }
    .sig-line strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 3px;
    }
    
    /* Dashboard Layout */
    .dashboard {
      max-width: 1050px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 18px 0;
    }
    .metric, .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }
    .metric strong {
      display: block;
      color: var(--primary);
      font-size: 28px;
      font-weight: 700;
      font-family: Georgia, serif;
    }
    .metric span {
      display: block;
      font-weight: 600;
      margin-top: 5px;
      font-size: 14px;
      color: var(--ink);
    }
    .metric small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
      font-size: 12px;
    }
    .panel { margin: 18px 0; }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    
    /* Charts */
    .chart-container {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      flex-wrap: wrap;
      padding: 10px 0;
    }
    .chart-svg {
      width: 180px;
      height: 180px;
      transform: rotate(-90deg);
      border-radius: 50%;
    }
    .chart-legend {
      display: grid;
      gap: 8px;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex: none;
    }
    
    .bar-chart {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 140px 1fr 65px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .bar-track {
      background: var(--line-light);
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--primary);
      transition: width 0.4s ease;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--line-light);
    }
    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #F8FAFC;
    }
    tr:hover td { background: #fbfcfe; }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: white;
      padding: 14px 22px;
      border-radius: var(--radius);
      z-index: 100;
      box-shadow: var(--shadow-lg);
      font-weight: 500;
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 41, 66, 0.55);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
      z-index: 200;
      padding: 20px;
    }
    .modal {
      background: white;
      border-radius: var(--radius);
      max-width: 620px;
      width: 100%;
      padding: 26px;
      box-shadow: var(--shadow-lg);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-steps { display: flex; }
      .formpane { padding: 24px 16px; }
      .two-col { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .wrap { padding: 20px 14px; }
      .signatures-block { grid-template-columns: 1fr; gap: 30px; }
      .report { padding: 20px 14px; }
      .report-row { flex-direction: column; gap: 4px; }
      .report-row span:first-child { max-width: none; }
      .report-row span:last-child { text-align: left; }
    }
    
    @media print {
      body { background: white; color: black; font-size: 12pt; }
      .no-print { display: none !important; }
      .report { max-width: none; padding: 0; border: none; box-shadow: none; }
      .report-section { break-inside: avoid; }
      .report-row { border-bottom: 1px solid #ddd; padding: 6px 0; }
      .signatures-block { break-inside: avoid; margin-top: 40px; }
      .wrap { max-width: none; padding: 0; }
      .metric, .panel { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
      @page { margin: 12mm; }
    }
  </style>

// Initialize Supabase Client
function initSupabase() {
  try {
    let saved = JSON.parse(localStorage.getItem(SUPABASE_KEY) || '{}');
    let url = saved.url || DEFAULT_SUPABASE_URL;
    let key = saved.key || DEFAULT_SUPABASE_KEY;
    
    if (url && key && window.supabase) {
      supabaseConfig = { url, key };
      supabaseClient = window.supabase.createClient(url, key);
      supabaseStatus = 'online';
      syncWithSupabase();
    } else {
      supabaseStatus = 'offline';
    }
  } catch (e) {
    console.warn('Supabase offline fallback:', e);
    supabaseStatus = 'offline';
  }
}

function loadSession() {
  try {
    currentUser = JSON.parse(localStorage.getItem(USER_SESSION_KEY) || 'null');
  } catch (e) {
    currentUser = null;

}

function saveSession(u) {
  currentUser = u;
  if (u) localStorage.setItem(USER_SESSION_KEY, JSON.stringify(u));
  else localStorage.removeItem(USER_SESSION_KEY);
}

function logout() {

  render();
}

async function syncWithSupabase(showNotification = false) {
  if (!supabaseClient) return;
  supabaseStatus = 'syncing';
  updateHeaderUserAndCloud();

  try {
    // 1. Fetch remote users
    const { data: remoteUsers, error: uErr } = await supabaseClient.from('usuarios').select('*');
    if (!uErr && Array.isArray(remoteUsers)) {
      users = remoteUsers;
    }

    // 2. Fetch remote custom types
    const { data: remoteTypes, error: tErr } = await supabaseClient.from('tipos_visitas').select('*');
    if (!tErr && Array.isArray(remoteTypes)) {
      remoteTypes.forEach(t => {
        if (t && t.id && Array.isArray(t.sections)) {
          VISIT_TYPES[t.id] = { id: t.id, label: t.label, short: t.short_label, color: t.color, sections: t.sections };
        }
      });
      saveTypes();
    }

    // 3. Fetch remote visits
    const { data: remoteVisits, error: vErr } = await supabaseClient.from('visitas').select('*');
    if (!vErr && Array.isArray(remoteVisits)) {
      let localMap = new Map(visits.map(v => [v._id, v]));
      remoteVisits.forEach(r => {
        let rec = r.data || {};
        rec._id = r.id;
        rec._type = r.type;
        rec._completed = r.completed;
        rec._updated = r.updated_at;
        
        let local = localMap.get(r.id);
        if (!local || (r.updated_at && (!local._updated || r.updated_at > local._updated))) {
          localMap.set(r.id, rec);
        }
      });
      visits = [...localMap.values()];
      persist();
    }

    // 4. Upsert local visits back to cloud
    if (visits.length > 0) {
      let rowsToUpsert = visits.map(v => ({
        id: v._id,
        type: v._type,
        producer_name: subject(v),
        property_name: property(v),
        visit_date: date(v) || null,
        responsible: responsible(v),
        route_city: routeOrCity(v),
        daily_volume: dailyVolume(v),
        risk_level: riskLevel(v),
        completed: v._completed !== false,
        data: v,
        updated_at: v._updated || new Date().toISOString()
      }));
      await supabaseClient.from('visitas').upsert(rowsToUpsert, { onConflict: 'id' });
    }

    supabaseStatus = 'online';
    updateHeaderUserAndCloud();
    if (showNotification) toast('Sincronização com Supabase concluída!');
    render();
  } catch (err) {
    console.error('Erro na sincronização:', err);
    supabaseStatus = 'online';
    updateHeaderUserAndCloud();
    if (showNotification) toast('Erro ao sincronizar: ' + err.message);
  }
}

async function saveVisitToSupabase(rec) {
  if (!supabaseClient) return;
  try {
    await supabaseClient.from('visitas').upsert({
      id: rec._id,
      type: rec._type,
      producer_name: subject(rec),
      property_name: property(rec),
      visit_date: date(rec) || null,
      responsible: responsible(rec),
      route_city: routeOrCity(rec),
      daily_volume: dailyVolume(rec),
      risk_level: riskLevel(rec),
      completed: rec._completed !== false,
      data: rec,
      updated_at: new Date().toISOString()
    }, { onConflict: 'id' });
  } catch (err) {
    console.warn('Erro ao salvar no Supabase:', err);
  }
}

async function deleteVisitFromSupabase(id) {
  if (!supabaseClient) return;
  try {
    await supabaseClient.from('visitas').delete().eq('id', id);
  } catch (err) {
    console.warn('Erro ao deletar no Supabase:', err);
  }
}

function updateHeaderUserAndCloud() {
  let el = $('#cloud-status-btn');
  if (!el) return;
  if (supabaseStatus === 'online') {
    el.className = 'cloud-pill cloud-online';
    el.innerHTML = '🟢 Nuvem Sincronizada';
  } else if (supabaseStatus === 'syncing') {
    el.className = 'cloud-pill cloud-syncing';
    el.innerHTML = '🔄 Sincronizando...';
  } else {
    el.className = 'cloud-pill cloud-offline';
    el.innerHTML = '🟡 Modo Offline';
  }
}

async function approveUser(uid) {
  let u = users.find(x => x.id === uid);
  if (!u) return;
  u.status = 'aprovado';
  u.autorizado_por = currentUser ? currentUser.nome : 'Administrador Atalat';
  u.updated_at = new Date().toISOString();
  
  if (supabaseClient) {
    await supabaseClient.from('usuarios').upsert(u);
  }
  toast(`Acesso autorizado para ${u.nome}!`);
  openUsersModal();
}

async function rejectUser(uid) {
  if (!confirm('Recusar e remover este pedido de cadastro?')) return;
  if (supabaseClient) {
    await supabaseClient.from('usuarios').delete().eq('id', uid);
  }
  users = users.filter(x => x.id !== uid);
  toast('Solicitação recusada.');
  openUsersModal();
}

async function blockUser(uid) {
  let u = users.find(x => x.id === uid);
  if (!u) return;
  if (!confirm(`Bloquear o acesso de ${u.nome}?`)) return;
  u.status = 'bloqueado';
  if (supabaseClient) {
    await supabaseClient.from('usuarios').upsert(u);
  }
  toast(`Usuário ${u.nome} bloqueado.`);
  openUsersModal();
}

async function toggleAdmin(uid) {
  let u = users.find(x => x.id === uid);
  if (!u) return;
  u.role = 'admin';
  if (supabaseClient) {
    await supabaseClient.from('usuarios').upsert(u);

  openUsersModal();
}

      rows.forEach(t => {
        if (t && /^custom_[a-z0-9_-]+$/.test(t.id) && typeof t.label === 'string' && Array.isArray(t.sections) && t.sections.length) {
          VISIT_TYPES[t.id] = { ...t, short: t.label, color: t.color || '#357EC4' };
        }
      });
    }
  } catch (e) {}
}

function saveTypes() {
  let rows = Object.entries(VISIT_TYPES).filter(([k]) => k.startsWith('custom_')).map(([id, t]) => ({ id, label: t.label, short: t.short, color: t.color, sections: t.sections }));
  localStorage.setItem(TYPES_KEY, JSON.stringify(rows));
}

function load() {
  try {
    let x = JSON.parse(localStorage.getItem(KEY) || '[]');
    visits = Array.isArray(x) ? x : [];
  } catch (e) {
    visits = [];
  }
}

function persist() {
  localStorage.setItem(KEY, JSON.stringify(visits));
}

function toast(s) {
  let d = document.createElement('div');
  d.className = 'toast';
  d.textContent = s;
  document.body.append(d);
  setTimeout(() => d.remove(), 2800);
}

function base(t) {
  let o = {};
  VISIT_TYPES[t].sections.forEach(s => s.fields.forEach(f => o[f.id] = f.type === 'checkbox' ? [] : ''));
  return o;
}

function subject(v) {
  if (!v) return 'Sem nome';
  if (v._type === 'relacionamento') return v.r4 || v.r5 || 'Sem nome';
  if (v._type === 'compra') return v.p3 || v.p4 || 'Sem nome';
  if (v._type === 'comercial') return v.m4 || 'Sem nome';
  if (v._type === 'defesa') return v.d4 || 'Sem nome';
  if (v._type === 'perda') return v.l4 || 'Sem nome';
  return VISIT_TYPES[v._type]?.sections?.flatMap(s => s.fields).filter(f => f.type === 'text').map(f => v[f.id]).find(Boolean) || 'Sem nome';
}

function property(v) {
  if (!v) return '';
  if (v._type === 'compra') return v.p4 || '';
  if (v._type === 'relacionamento') return v.r5 || '';
  return '';
}

function date(v) {
  if (!v) return '';
  if (v._type === 'relacionamento') return v.r2 || '';
  if (v._type === 'compra') return v.p2 || '';
  if (v._type === 'comercial') return v.m2 || '';
  if (v._type === 'defesa') return v.d2 || '';
  if (v._type === 'perda') return v.l2 || '';
  return VISIT_TYPES[v._type]?.sections?.flatMap(s => s.fields).filter(f => f.type === 'date').map(f => v[f.id]).find(Boolean) || '';
}

function responsible(v) {
  if (!v) return '';
  if (v._type === 'compra') return v.p1 || '';
  if (v._type === 'relacionamento') return v.r1 || '';
  if (v._type === 'comercial') return v.m1 || '';
  if (v._type === 'defesa') return v.d1 || '';
  if (v._type === 'perda') return v.l1 || '';
  return '';
}

function routeOrCity(v) {
  if (!v) return '';
  if (v._type === 'compra') return [v.p7, v.p8].filter(Boolean).join(' - ');
  if (v._type === 'relacionamento') return v.r6 || '';
  if (v._type === 'comercial') return v.m5 || '';
  if (v._type === 'defesa') return v.d5 || '';
  if (v._type === 'perda') return v.l5 || '';
  return '';
}

function phone(v) {
  if (!v) return '';
  return v.p6 || '';
}

function dailyVolume(v) {
  if (!v) return 0;
  let val = v.p52 || v.p11 || v.r7 || v.m7 || v.d6 || v.l6 || 0;
  return Number(String(val).replace(',', '.')) || 0;
}

function riskLevel(v) {
  if (!v || v._type !== 'relacionamento') return '';
  return v.r33 || '';
}

function formatDate(iso) {
  if (!iso) return '';
  let parts = iso.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return iso;
}

function accent() {
  return VISIT_TYPES[type]?.color || '#1E5E3A';
}

function all() {
  if (dirty && !confirm('Há alterações não salvas. Deseja sair mesmo assim?')) return;
  dirty = false;
  view = 'list';
  render();
}

function start(t) {
  type = t;
  form = base(t);
  id = 'v_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).substr(2, 6));
  let today = new Date().toLocaleDateString('en-CA');
  
  // Auto-fill responsible user and date
  let respName = currentUser ? currentUser.nome : '';
  if (type === 'compra') { form.p2 = today; if (respName) form.p1 = respName; }
  if (type === 'relacionamento') { form.r2 = today; if (respName) form.r1 = respName; }
  if (type === 'comercial') { form.m2 = today; if (respName) form.m1 = respName; }
  if (type === 'defesa') { form.d2 = today; if (respName) form.d1 = respName; }
  if (type === 'perda') { form.l2 = today; if (respName) form.l1 = respName; }
  
  sectionIdx = 0;
  dirty = false;
  view = 'form';
  render();
}

function edit(x) {
  type = x._type || 'compra';
  form = { ...base(type), ...x };
  id = x._id;
  sectionIdx = 0;
  dirty = false;
  view = 'form';
  render();
}

function duplicateVisit(orig) {
  if (!orig) return;
  let newRec = { ...orig };
  newRec._id = 'v_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).substr(2, 6));
  newRec._completed = false;
  newRec._updated = new Date().toISOString();
  let today = new Date().toLocaleDateString('en-CA');
  if (newRec.p2) newRec.p2 = today;
  if (newRec.r2) newRec.r2 = today;
  if (newRec.m2) newRec.m2 = today;
  if (newRec.d2) newRec.d2 = today;
  if (newRec.l2) newRec.l2 = today;
  
  type = newRec._type || 'compra';
  form = newRec;
  id = newRec._id;
  sectionIdx = 0;
  dirty = true;
  view = 'form';
  toast('Visita duplicada! Edite os dados e salve.');
  render();
}

function save(complete = false) {
  try {
    let rec = {
      ...form,
      _id: id,
      _type: type,
      _completed: complete || form._completed === true,
      _updated: new Date().toISOString(),
    };
    let i = visits.findIndex(v => v._id === id);
    if (i >= 0) visits[i] = rec;
    else visits.push(rec);
    persist();
    dirty = false;
    
    // Asynchronously sync to Supabase
    saveVisitToSupabase(rec);

    toast(complete ? 'Visita concluída com sucesso!' : 'Rascunho salvo');
    return rec;
  } catch (e) {
    toast('Erro ao salvar no navegador');
    return null;
  }
}

function removeVisit(xId) {
  if (!confirm('Tem certeza de que deseja excluir permanentemente este registro?')) return;
  visits = visits.filter(v => v._id !== xId);
  try {
    persist();
    deleteVisitFromSupabase(xId);
    toast('Visita removida');
    render();
  } catch (e) {
    load();
    toast('Erro ao remover');
  }
}

function getFilteredVisits() {
  let list = [...visits];
  
  if (searchQuery.trim()) {
    let q = searchQuery.toLowerCase().trim();
    list = list.filter(v => {
      let s = subject(v).toLowerCase();
      let p = property(v).toLowerCase();
      let r = responsible(v).toLowerCase();
      let loc = routeOrCity(v).toLowerCase();
      let note = (v.p51 || v.r40 || v.d13 || v.l11 || v.m9 || '').toLowerCase();
      return s.includes(q) || p.includes(q) || r.includes(q) || loc.includes(q) || note.includes(q);
    });
  }
  
  if (filterType !== 'all') {
    list = list.filter(v => v._type === filterType);
  }
  
  if (filterStatus === 'done') {
    list = list.filter(v => v._completed !== false);
  } else if (filterStatus === 'draft') {
    list = list.filter(v => v._completed === false);
  }
  
  if (filterRisk !== 'all') {
    list = list.filter(v => (v.r33 || '').startsWith(filterRisk));
  }
  
  list.sort((a, b) => {
    if (sortBy === 'date_desc') return (date(b) || '').localeCompare(date(a) || '');
    if (sortBy === 'date_asc') return (date(a) || '').localeCompare(date(b) || '');
    if (sortBy === 'name_asc') return subject(a).localeCompare(subject(b));
    if (sortBy === 'volume_desc') return dailyVolume(b) - dailyVolume(a);
    return 0;
  });
  
  return list;
}

function exportExcel() {
  let list = getFilteredVisits();
  if (!list.length) {
    toast('Nenhum registro para exportar.');
    return;
  }
  
  let headers = [
    'ID', 'Tipo de Visita', 'Status', 'Data da Visita', 'Produtor', 'Propriedade',
    'Rota / Município', 'Telefone / WhatsApp', 'Responsável Atalat', 'Volume Diário (L/dia)',
    'Volume Mensal Est. (L/mês)', 'Risco de Perda', 'Motivo / Situação', 'Ação / Encaminhamento',
    'Prazo de Retorno', 'Última Atualização'
  ];
  
  let rows = list.map(v => {
    let t = VISIT_TYPES[v._type] || { short: v._type };
    let vol = dailyVolume(v);
    let volM = vol * 30.5;
    let r = riskLevel(v);
    let mot = v.l7 || v.d7 || v.r32 || v.p24 || v.m6 || '';
    let act = v.r35 || v.d9 || v.l11 || v.p51 || v.m9 || '';
    let dead = v.r38 || v.d11 || v.m12 || '';
    
    return [
      v._id,
      t.short,
      v._completed !== false ? 'Concluída' : 'Rascunho',
      date(v) || '',
      subject(v),
      property(v),
      routeOrCity(v),
      phone(v),
      responsible(v),
      vol ? vol.toLocaleString('pt-BR') : '0',
      volM ? Math.round(volM).toLocaleString('pt-BR') : '0',
      r || 'Não classificado',
      mot,
      act,
      dead,
      v._updated ? new Date(v._updated).toLocaleDateString('pt-BR') : ''
    ];
  });
  
  let csvContent = '\uFEFF' + [
    headers.map(h => `"${h.replace(/"/g, '""')}"`).join(';'),
    ...rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';'))
  ].join('\r\n');
  
  let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = `Atalat_Visitas_${new Date().toLocaleDateString('en-CA')}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Planilha Excel (.csv) exportada com sucesso!');
}

function formatWhatsAppText(v) {
  let t = VISIT_TYPES[v._type] || { label: 'Visita' };
  let prod = subject(v);
  let prop = property(v);
  let loc = routeOrCity(v);
  let dt = formatDate(date(v));
  let resp = responsible(v);
  let vol = dailyVolume(v);
  let r = riskLevel(v);
  let status = v._completed !== false ? 'Concluída' : 'Rascunho / Em Andamento';
  let mot = v.l7 || v.d7 || v.r32 || v.p24 || v.m6 || '';
  let act = v.r35 || v.d9 || v.l11 || v.p51 || v.m9 || '';
  let dead = formatDate(v.r38 || v.d11 || v.m12 || '');

  let lines = [
    `🥛 *ATALAT — REGISTRO DE VISITA*`,
    `📋 *Tipo:* ${t.label}`,
    `👤 *Produtor:* ${prod}${prop ? ' (' + prop + ')' : ''}`,
    `📍 *Local/Rota:* ${loc || 'Não informado'}`,
    `📅 *Data da Visita:* ${dt || 'Não informada'}`,
    `👨‍💼 *Responsável Atalat:* ${resp || 'Não informado'}`,
  ];
  if (vol > 0) {
    lines.push(`📊 *Volume Diário:* ${vol.toLocaleString('pt-BR')} L/dia (~${Math.round(vol * 30.5).toLocaleString('pt-BR')} L/mês)`);
  }
  if (r) {
    lines.push(`⚠️ *Classificação de Risco:* ${r}`);
  }
  if (mot) {
    lines.push(`🎯 *Ponto Principal:* ${mot}`);
  }
  if (act) {
    lines.push(`📝 *Ação / Encaminhamento:* ${act}`);
  }
  if (dead) {
    lines.push(`⏰ *Prazo de Retorno:* ${dead}`);
  }
  lines.push(`📌 *Status:* ${status}`);
  lines.push(`\n_Gestão de Captação e Fornecedores Atalat_`);
  return lines.join('\n');
}

function captureGPS(fieldId) {
  if (!navigator.geolocation) {
    toast('Geolocalização não suportada neste navegador.');
    return;
  }
  toast('Capturando coordenadas GPS...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      let lat = pos.coords.latitude.toFixed(6);
      let lng = pos.coords.longitude.toFixed(6);
      let acc = Math.round(pos.coords.accuracy);
      let gpsStr = `Lat: ${lat}, Long: ${lng} (Acurácia: ${acc}m)`;
      form[fieldId] = (form[fieldId] ? form[fieldId] + ' | ' : '') + gpsStr;
      dirty = true;
      let el = $('#' + fieldId);
      if (el) el.value = form[fieldId];
      toast('📍 Coordenadas GPS capturadas com sucesso!');
    },
    err => {
      toast('Não foi possível obter a localização: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

          <button class="filter-pill ${filterType === 'defesa' ? 'active' : ''}" data-act="filter-type" data-type="defesa">Defesa <span>(${visits.filter(v => v._type === 'defesa').length})</span></button>
          <button class="filter-pill ${filterType === 'perda' ? 'active' : ''}" data-act="filter-type" data-type="perda">Perda <span>(${visits.filter(v => v._type === 'perda').length})</span></button>

              <option value="all" ${filterRisk === 'all' ? 'selected' : ''}>Todos os riscos</option>

              <option value="AMARELO" ${filterRisk === 'AMARELO' ? 'selected' : ''}>🟡 Amarelo (Atenção)</option>
              <option value="LARANJA" ${filterRisk === 'LARANJA' ? 'selected' : ''}>🟠 Laranja (Risco Concreto)</option>

      <!-- Visits Cards Grid -->
      ${list.length ? `
        <div class="cards">
          ${list.map(v => {
            let t = VISIT_TYPES[v._type] || VISIT_TYPES.compra;
            let r = riskLevel(v);
            let vol = dailyVolume(v);
            let isDraft = v._completed === false;
            let prop = property(v);
            let loc = routeOrCity(v);
            let dt = formatDate(date(v));
            let resp = responsible(v);

            return `
              <article class="card">
                <div class="card-main">
                  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                    <span class="badge" style="background:${t.color}18;color:${t.color}">${t.short}</span>
                    ${isDraft ? '<span class="badge badge-draft">✏️ Rascunho</span>' : '<span class="badge badge-done">✓ Concluída</span>'}
                    ${r ? `<span class="badge" style="background:${RISK_COLORS[r]}18;color:${RISK_COLORS[r]}">${esc(r.split(' — ')[0])}</span>` : ''}
                  </div>
                  
                  <div class="name">${esc(subject(v))}${prop ? ` <span class="muted" style="font-size:16px;font-weight:normal">(${esc(prop)})</span>` : ''}</div>
                  
                  <div class="card-meta">
                    ${loc ? `<span>📍 ${esc(loc)}</span><span>·</span>` : ''}
                    ${dt ? `<span>📅 ${esc(dt)}</span><span>·</span>` : ''}
                    ${resp ? `<span>👨‍💼 ${esc(resp)}</span>` : ''}
                  </div>

                  ${vol > 0 ? `
                    <div style="margin-top:6px;font-size:13px;font-weight:600;color:var(--ink-light)">
                      🥛 Volume: ${vol.toLocaleString('pt-BR')} L/dia <span class="muted" style="font-weight:normal">(~${Math.round(vol * 30.5).toLocaleString('pt-BR')} L/mês)</span>
                    </div>
                  ` : ''}
                </div>

                <div class="actions">
                  <button class="secondary" data-act="report" data-id="${esc(v._id)}" title="Visualizar e Imprimir Relatório">👁️ Relatório</button>
                  <button data-act="edit" data-id="${esc(v._id)}" title="Editar dados da visita">✏️ Editar</button>
                  <button class="ghost" data-act="duplicate" data-id="${esc(v._id)}" title="Criar nova visita baseada nesta">📋 Duplicar</button>
                  <button class="ghost" data-act="share-wa" data-id="${esc(v._id)}" title="Compartilhar no WhatsApp">💬 WhatsApp</button>
                  <button class="ghost danger-btn" data-act="remove" data-id="${esc(v._id)}" title="Excluir visita">🗑️</button>

          }).join('')}

      ` : `
        <div class="empty">
          <p style="font-size:18px;font-weight:600;margin:0 0 6px">Nenhuma visita encontrada</p>
          <p class="muted" style="margin:0 0 16px">Clique em "Nova Visita" para registrar ou carregue dados de demonstração.</p>
          <div style="display:flex;gap:10px;justify-content:center">
            <button class="primary" data-act="pick">＋ Iniciar Nova Visita</button>
            <button data-act="load-demo">✨ Carregar Dados de Exemplo</button>
          </div>
        </div>
      `}

      <footer style="text-align:center;padding:32px 16px 20px;color:var(--muted);font-size:12px" class="no-print">
        🥛 Atalat Laticínios · Sistema Integrado de Gestão de Campo · <strong>${APP_VERSION}</strong> (${APP_BUILD_DATE})
      </footer>
    </div>
  `;
}

function fieldHTML(f) {
  let v = form[f.id];
  let isVolumeField = ['p11', 'p12', 'p13', 'p17', 'p52', 'r7', 'm7', 'd6', 'l6'].includes(f.id);
  let isLocationField = ['p9', 'p8', 'p4', 'r6'].includes(f.id);
  let isPhoneField = f.id === 'p6';
  let numVal = Number(String(v ?? '').replace(',', '.')) || 0;

  if (['text', 'number', 'date'].includes(f.type)) {
    return `
      <div class="field">
        <label for="${f.id}">${esc(f.label)}</label>
        <input id="${f.id}" data-field="${f.id}" type="${f.type}" ${f.type === 'number' ? 'min="0" step="any"' : ''} value="${esc(v)}">
        
        ${isVolumeField && numVal > 0 ? `
          <small class="field-hint" style="color:var(--primary);font-weight:550">
            📊 Produção mensal estimada: ~${Math.round(numVal * 30.5).toLocaleString('pt-BR')} L/mês (~${Math.round(numVal * 365).toLocaleString('pt-BR')} L/ano)
          </small>
        ` : ''}

        ${f.id === 'p32' && numVal > 0 && (form.p11 || form.p52) ? `
          <small class="field-hint">
            🧊 Ocupação do tanque: ~${Math.round(((Number(form.p52 || form.p11) * (form.p38 === 'A cada 48 horas' ? 2 : 1)) / numVal) * 100)}% da capacidade
          </small>
        ` : ''}

        ${isLocationField ? `
          <button type="button" class="field-addon-btn" data-act="capture-gps" data-field="${f.id}">
            📍 Capturar Coordenadas GPS Atuais
          </button>
        ` : ''}

        ${isPhoneField && v ? `
          <a href="https://wa.me/55${String(v).replace(/\D/g, '')}" target="_blank" style="text-decoration:none">
            <button type="button" class="field-addon-btn" style="background:#E1F7E8;color:#0F5132;border-color:#BADBCC">
              💬 Abrir Conversa no WhatsApp
            </button>
          </a>
        ` : ''}
      </div>
    `;
  }

  if (f.type === 'textarea') {
    return `
      <div class="field">
        <label for="${f.id}">${esc(f.label)}</label>
        <textarea id="${f.id}" data-field="${f.id}">${esc(v)}</textarea>
      </div>
    `;
  }

  return `
    <div class="field">
      <fieldset>
        <legend>${esc(f.label)}</legend>
        <div class="choices">
          ${f.options.map((o, i) => {
            let checked = f.type === 'checkbox' ? (Array.isArray(v) && v.includes(o)) : v === o;
            return `
              <button type="button" class="choice ${checked ? 'selected' : ''}" aria-pressed="${checked}" data-choice="${f.id}" data-option="${i}">
                ${esc(o)}
              </button>
            `;
          }).join('')}
        </div>
      </fieldset>
    </div>
  `;
}

function formHTML() {
  let ss = VISIT_TYPES[type].sections, s = ss[sectionIdx];
  let allFields = ss.flatMap(x => x.fields);
  let filled = allFields.filter(f => Array.isArray(form[f.id]) ? form[f.id].length : !!form[f.id]).length;
  let pct = Math.round((filled / allFields.length) * 100);

  return `
    <div class="layout" style="--accent:${accent()}">
      <aside class="sidebar no-print">
        <button class="ghost" data-act="all" style="margin-bottom:12px;padding-left:0">← Todas as visitas</button>
        <span class="badge" style="background:${accent()}18;color:${accent()}">${VISIT_TYPES[type].short}</span>
        <div class="name" style="margin:8px 0 12px;font-size:18px">${esc(subject({ ...form, _type: type }))}</div>
        
        <div class="progress-wrap">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        <p class="muted small" style="margin-bottom:20px">${filled} de ${allFields.length} campos preenchidos (${pct}%)</p>

        <nav>
          ${ss.map((x, i) => `
            <button class="step ${i === sectionIdx ? 'active' : ''}" data-act="step" data-step="${i}">
              <strong>${i + 1}</strong>
              <span>${esc(x.title)}</span>
            </button>
          `).join('')}
        </nav>
      </aside>

      <div class="formpane">
        <div class="mobile-steps no-print">
          ${ss.map((x, i) => `
            <button class="${i === sectionIdx ? 'primary' : ''}" data-act="step" data-step="${i}" aria-label="Seção ${i + 1}: ${esc(x.title)}">
              ${i + 1}
            </button>
          `).join('')}
        </div>

        <div style="color:${accent()};font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:0.05em">
          Etapa ${sectionIdx + 1} de ${ss.length}
        </div>
        <h2 style="margin:4px 0 24px">${esc(s.title)}</h2>

        <form onsubmit="return false">
          ${s.fields.map(fieldHTML).join('')}
        </form>

        <div class="nav no-print">
          <button data-act="prev" ${sectionIdx === 0 ? 'disabled' : ''}>← Anterior</button>
          <div>
            <button data-act="save">💾 Salvar Rascunho</button>
            <button class="primary" data-act="${sectionIdx === ss.length - 1 ? 'finish' : 'next'}">
              ${sectionIdx === ss.length - 1 ? '✓ Concluir e Gerar Relatório' : 'Próxima Etapa →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function dashboardHTML() {
  let isAllTime = dashboardMonth === 'all';
  let all = isAllTime ? visits : visits.filter(v => date(v)?.slice(0, 7) === dashboardMonth);
  let done = all.filter(v => v._completed !== false);
  let draft = all.length - done.length;
  
  let by = t => done.filter(v => v._type === t);
  let buy = by('compra'), rel = by('relacionamento'), com = by('comercial'), def = by('defesa'), loss = by('perda');
  
  let num = x => Number(String(x ?? '').replace(',', '.')) || 0;
  let sum = (rows, key) => rows.reduce((a, v) => a + num(v[key]), 0);
  
  let lv = sum(loss, 'l6');
  let dv = sum(def, 'd6');
  let potential = sum(buy, 'p52');
  let held = def.filter(v => v.d12 === 'Mantido na Atalat');
  let pending = def.filter(v => v.d12 === 'Em acompanhamento' || !v.d12);
  let today = new Date().toLocaleDateString('en-CA');
  let overdue = pending.filter(v => v.d11 && v.d11 < today);
  
  let risks = rel.filter(v => /^(LARANJA|VERMELHO)/.test(v.r33 || ''));
  
  let riskGreen = rel.filter(v => (v.r33 || '').startsWith('VERDE')).length;
  let riskYellow = rel.filter(v => (v.r33 || '').startsWith('AMARELO')).length;
  let riskOrange = rel.filter(v => (v.r33 || '').startsWith('LARANJA')).length;
  let riskRed = rel.filter(v => (v.r33 || '').startsWith('VERMELHO')).length;
  let totalRiskClassified = riskGreen + riskYellow + riskOrange + riskRed;

  let reasons = {};
  loss.forEach(v => {
    let k = v.l7 || 'Não informado';
    reasons[k] = (reasons[k] || 0) + 1;
  });
  let names = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  
  let routeVolume = {};
  done.forEach(v => {
    let r = routeOrCity(v) || 'Outros / Sem rota';
    let vol = dailyVolume(v);
    if (vol > 0) routeVolume[r] = (routeVolume[r] || 0) + vol;
  });
  let topRoutes = Object.entries(routeVolume).sort((a, b) => b[1] - a[1]).slice(0, 5);
  let maxRouteVol = topRoutes.length ? topRoutes[0][1] : 1;

  let fmt = n => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(n);
  let metric = (label, value, hint = '') => `
    <div class="metric">
      <strong>${esc(value)}</strong>
      <span>${esc(label)}</span>
      ${hint ? `<small>${esc(hint)}</small>` : ''}
    </div>
  `;

  return `
    <div class="wrap dashboard">
      <div class="top no-print">
        <button class="ghost" data-act="all">← Voltar para a lista</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button data-act="export-excel">📥 Exportar Dados (Excel)</button>
          <button class="dark" data-act="print-dashboard">🖨️ Imprimir / Salvar PDF</button>
        </div>
      </div>

      <div class="brand">ATALAT · DIRETORIA & INTELIGÊNCIA DE CAPTAÇÃO</div>
      <h1>Painel Analítico de Visitas</h1>

      <div class="toolbar no-print" style="margin-bottom:16px">
        <label for="dashboard-month" style="display:inline-flex;align-items:center;gap:8px;font-weight:600">
          Mês de referência:
          <input id="dashboard-month" type="month" value="${isAllTime ? '' : esc(dashboardMonth)}" ${isAllTime ? 'disabled' : ''}>
        </label>
        <button class="${!isAllTime && dashboardMonth === new Date().toLocaleDateString('en-CA').slice(0, 7) ? 'primary' : ''}" data-act="dash-period" data-period="current">Mês Atual</button>
        <button class="${isAllTime ? 'primary' : ''}" data-act="dash-period" data-period="all">🌐 Todo o Histórico</button>
      </div>

      <p class="muted small" style="margin-top:0">
        Período selecionado: <strong>${isAllTime ? 'Todo o histórico cadastrado' : dashboardMonth.split('-').reverse().join('/')}</strong>. 
        Indicadores calculados com base nas datas das visitas e formulários preenchidos.
      </p>

      <!-- KPI Grid -->
      <div class="metrics">
        ${metric('Visitas Concluídas', done.length, `${draft} rascunhos em andamento`)}
        ${metric('Volume Provável de Entrada', fmt(potential) + ' L/dia', `~${fmt(potential * 30.5)} L/mês`)}
        ${metric('Volume em Defesa', fmt(dv) + ' L/dia', `${def.length} ações de retenção`)}
        ${metric('Volume Perdido', fmt(lv) + ' L/dia', `${loss.length} saídas registradas`)}
        ${metric('Acordos Comerciais', com.filter(v => v.m10 === 'Acordo fechado').length, `${com.length} visitas comerciais`)}
        ${metric('Risco Alto/Crítico', risks.length, `Entre ${rel.length} visitas de relacionamento`)}
      </div>

      <!-- Charts & Visual Analytics -->
      <div class="two-col">
        <!-- Risk Distribution Donut -->
        <section class="panel">
          <h2>Distribuição de Risco de Perda</h2>
          ${totalRiskClassified > 0 ? `
            <div class="chart-container">
              <svg viewBox="0 0 36 36" class="chart-svg">
                ${(() => {
                  let offset = 0;
                  let colors = [
                    { count: riskGreen, color: '#1E5E3A' },
                    { count: riskYellow, color: '#C9922B' },
                    { count: riskOrange, color: '#D97706' },
                    { count: riskRed, color: '#BA2525' }
                  ];
                  return colors.map(c => {
                    if (!c.count) return '';
                    let pct = (c.count / totalRiskClassified) * 100;
                    let stroke = `stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="-${offset}"`;
                    offset += pct;
                    return `<circle cx="18" cy="18" r="15.915" fill="transparent" stroke="${c.color}" stroke-width="4.5" ${stroke}></circle>`;
                  }).join('');
                })()}
              </svg>

              <div class="chart-legend">
                <div class="legend-item"><span class="legend-color" style="background:#1E5E3A"></span> 🟢 Verde (Saudável): <strong>${riskGreen}</strong> (${Math.round((riskGreen / totalRiskClassified) * 100)}%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#C9922B"></span> 🟡 Amarelo (Atenção): <strong>${riskYellow}</strong> (${Math.round((riskYellow / totalRiskClassified) * 100)}%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#D97706"></span> 🟠 Laranja (Risco Real): <strong>${riskOrange}</strong> (${Math.round((riskOrange / totalRiskClassified) * 100)}%)</div>
                <div class="legend-item"><span class="legend-color" style="background:#BA2525"></span> 🔴 Vermelho (Iminente): <strong>${riskRed}</strong> (${Math.round((riskRed / totalRiskClassified) * 100)}%)</div>
              </div>
            </div>
          ` : '<p class="muted">Nenhuma visita de relacionamento com classificação de risco no período.</p>'}
        </section>

        <!-- Top Routes by Volume -->
        <section class="panel">
          <h2>Maiores Volumes por Rota / Linha</h2>
          ${topRoutes.length ? `
            <div class="bar-chart">
              ${topRoutes.map(([rName, rVol]) => `
                <div class="bar-row">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(rName)}">${esc(rName)}</span>
                  <div class="bar-track">
                    <div class="bar-fill" style="width:${Math.round((rVol / maxRouteVol) * 100)}%"></div>
                  </div>
                  <strong style="text-align:right">${fmt(rVol)} L</strong>
                </div>
              `).join('')}
            </div>
          ` : '<p class="muted">Nenhum volume registrado nas rotas neste período.</p>'}
        </section>
      </div>

      <!-- Action Tracking -->
      <div class="two-col">
        <section class="panel">
          <h2>Acompanhamentos Prioritários & Defesa</h2>
          ${[
            ...overdue.map(v => ({ v, note: 'Prazo Vencido', color: 'var(--danger)' })),
            ...pending.filter(v => !overdue.includes(v)).map(v => ({ v, note: 'Em Acompanhamento', color: 'var(--amber)' })),
            ...risks.map(v => ({ v, note: 'Risco ' + (v.r33 || '').split(' — ')[0], color: 'var(--danger)' })),
            ...loss.filter(v => v.l10 === 'Alta').map(v => ({ v, note: 'Retorno Provável', color: 'var(--primary)' }))
          ].length ? `
            <table>
              <thead>
                <tr>
                  <th>Produtor</th>
                  <th>Tipo</th>
                  <th>Situação</th>
                  <th>Prazo/Data</th>
                </tr>
              </thead>
              <tbody>
                ${[
                  ...overdue.map(v => ({ v, note: 'Prazo Vencido', color: 'var(--danger)' })),
                  ...pending.filter(v => !overdue.includes(v)).map(v => ({ v, note: 'Em Acompanhamento', color: 'var(--amber)' })),
                  ...risks.map(v => ({ v, note: 'Risco ' + (v.r33 || '').split(' — ')[0], color: 'var(--danger)' })),
                  ...loss.filter(v => v.l10 === 'Alta').map(v => ({ v, note: 'Retorno Provável', color: 'var(--primary)' }))
                ].slice(0, 8).map(({ v, note, color }) => `
                  <tr>
                    <td><strong>${esc(subject(v))}</strong></td>
                    <td>${esc(VISIT_TYPES[v._type]?.short || v._type)}</td>
                    <td><span class="badge" style="background:${color}18;color:${color}">${esc(note)}</span></td>
                    <td>${esc(formatDate(v.d11 || v.r38 || date(v)))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<p class="muted">Nenhum alerta ou acompanhamento prioritário pendente.</p>'}
        </section>

        <section class="panel">
          <h2>Motivos de Perda / Saída</h2>
          ${names.length ? `
            <table>
              <thead>
                <tr>
                  <th>Motivo da Perda</th>
                  <th>Produtores</th>
                  <th>% do Total</th>
                </tr>
              </thead>
              <tbody>
                ${names.map(([k, count]) => `
                  <tr>
                    <td><strong>${esc(k)}</strong></td>
                    <td>${count}</td>
                    <td>${Math.round((count / loss.length) * 100)}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<p class="muted">Nenhuma perda de fornecedor registrada no período.</p>'}
        </section>
      </div>

      <footer style="text-align:center;padding:32px 16px 20px;color:var(--muted);font-size:12px" class="no-print">
        🥛 Atalat Laticínios · Sistema Integrado de Gestão de Campo · <strong>${APP_VERSION}</strong> (${APP_BUILD_DATE})
      </footer>
    </div>
  `;
}

  d.style.display = 'block';
  d.style.marginTop = '12px';
  d.innerHTML = `
    <div class="top" style="margin-bottom:10px">
      <strong>Pergunta ${n}</strong>
      <button class="ghost danger-btn" data-act="remove-question">Remover</button>
    </div>
    <div class="field">
      <label>Enunciado da pergunta</label>
      <input class="q-label" placeholder="Escreva a pergunta">
    </div>
    <div class="field">
      <label>Tipo de campo</label>
      <select class="q-type">
        <option value="text">Texto curto</option>
        <option value="textarea">Texto longo</option>
        <option value="number">Número</option>
        <option value="date">Data</option>
        <option value="radio">Escolha única (Tags)</option>
        <option value="checkbox">Múltipla escolha (Tags)</option>
      </select>
    </div>
    <div class="field">
      <label>Opções de escolha (separadas por ponto e vírgula)</label>
      <input class="q-options" placeholder="Ex.: Sim; Não; Parcialmente">
    </div>
  `;
  c.append(d);
}

function removeQuestion(el) {
  el.closest('.custom-question').remove();
}

async function saveCustom() {
  let label = $('#custom-title').value.trim();
  let section = $('#custom-section').value.trim();
  let fields = [...$$('.custom-question')].map((d, i) => ({
    id: 'c' + i + '_' + Date.now(),
    label: d.querySelector('.q-label').value.trim(),
    type: d.querySelector('.q-type').value,
    options: d.querySelector('.q-options').value.split(';').map(x => x.trim()).filter(Boolean),
  }));

  if (!label || !section || !fields.length || fields.some(f => !f.label || (['radio', 'checkbox'].includes(f.type) && f.options.length < 2))) {
    toast('Preencha o nome, a seção e as perguntas. Campos de escolha exigem ao menos duas opções.');
    return;
  }

  let key = 'custom_' + Date.now().toString(36);
  VISIT_TYPES[key] = { label, short: label, color: '#357EC4', sections: [{ title: section, fields }] };
  try {
    saveTypes();
    if (supabaseClient) {
      await supabaseClient.from('tipos_visitas').upsert({
        id: key,
        label: label,
        short_label: label,
        color: '#357EC4',
        sections: [{ title: section, fields }]
      });
    }
    toast('Tipo de visita criado com sucesso!');
    start(key);
  } catch (e) {
    delete VISIT_TYPES[key];
    toast('Não foi possível salvar o tipo');
  }
}

function render() {
  let root = $('#app');
  
  // If not logged in, render login page
  if (!currentUser) {
    root.innerHTML = loginHTML();
    window.scrollTo(0, 0);
    return;
  }

  if (report) {
    root.innerHTML = reportHTML(report);
  } else if (view === 'list') {
    root.innerHTML = listHTML();
  } else if (view === 'dashboard') {
    root.innerHTML = dashboardHTML();
  } else if (view === 'picker') {
    root.innerHTML = `
      <div class="wrap" style="max-width:680px">
        <button class="ghost" data-act="all" style="margin-bottom:12px">← Voltar</button>
        <h2>Qual tipo de visita você vai registrar?</h2>
        <p class="muted">Selecione o formulário correspondente ao objetivo da visita.</p>
        
        ${Object.entries(VISIT_TYPES).map(([k, t]) => `
          <button class="pick" data-act="start" data-type="${k}">
            <b style="color:${t.color};font:20px Georgia,serif">${esc(t.label)}</b><br>
            <span class="muted small">${t.sections.length} etapas · ${t.sections.reduce((n, s) => n + s.fields.length, 0)} campos de preenchimento</span>
          </button>
        `).join('')}

        <button class="pick" data-act="custom-builder" style="border-style:dashed">
          <b>＋ Criar formulário personalizado</b><br>
          <span class="muted small">Configure perguntas e seções para novas rotinas de campo.</span>
        </button>
      </div>
    `;
  } else if (view === 'builder') {
    root.innerHTML = builderHTML();
  } else {
    root.innerHTML = formHTML();
  }
  window.scrollTo(0, 0);
}

// Global Event Listeners
document.addEventListener('input', e => {
  let f = e.target.dataset.field;
  if (f) {
    form[f] = e.target.value;
    dirty = true;
  }
  if (e.target.id === 'search-box') {
    searchQuery = e.target.value;
    render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'dashboard-month') {
    dashboardMonth = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'status-filter') {
    filterStatus = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'risk-filter') {
    filterRisk = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'sort-filter') {
    sortBy = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'import-file') {
    let file = e.target.files[0];
    if (!file) return;
    try {
      let payload = JSON.parse(await file.text());
      let rows = payload.visits;
      if (payload.format !== 'atalat-visitas' || !Array.isArray(rows)) throw Error('Formato inválido');
      
      if (!confirm(`Deseja importar ${rows.length} visita(s)? Registros existentes com mesmo ID serão atualizados.`)) return;
      
      if (Array.isArray(payload.types)) {
        payload.types.forEach(t => {
          if (t && /^custom_[a-z0-9_-]+$/.test(t.id) && Array.isArray(t.sections)) VISIT_TYPES[t.id] = t;
        });
        saveTypes();
      }
      
      let map = new Map(visits.map(x => [x._id, x]));
      rows.forEach(x => map.set(x._id, x));
      visits = [...map.values()];
      persist();
      if (supabaseClient) syncWithSupabase();
      toast('Backup importado com sucesso!');
      render();
    } catch (err) {
      toast('Arquivo de backup inválido.');
    } finally {
      e.target.value = '';
    }
  }
});

document.addEventListener('click', async e => {
  if (e.target && e.target.classList && e.target.classList.contains('modal-overlay')) {
    $('#modal-container').innerHTML = '';
    return;
  }
  let el = e.target.closest('[data-choice],[data-act]');
  if (!el) return;

  if (el.dataset.choice) {
    let f = VISIT_TYPES[type].sections.flatMap(s => s.fields).find(x => x.id === el.dataset.choice);
    let o = f.options[Number(el.dataset.option)];
    if (f.type === 'checkbox') {
      let v = Array.isArray(form[f.id]) ? form[f.id] : [];
      form[f.id] = v.includes(o) ? v.filter(x => x !== o) : [...v, o];
    } else {
      form[f.id] = o;
    }
    dirty = true;
    let choices = el.parentElement.querySelectorAll('.choice');
    choices.forEach(x => {
      let on = f.type === 'checkbox' ? form[f.id].includes(f.options[Number(x.dataset.option)]) : form[f.id] === f.options[Number(x.dataset.option)];
      x.classList.toggle('selected', on);
      x.setAttribute('aria-pressed', String(on));
    });
    return;
  }

  let a = el.dataset.act;
  let x = visits.find(v => v._id === el.dataset.id);

  if (a === 'switch-auth-tab') {
    authTab = el.dataset.tab;
    render();
  }
  else if (a === 'do-login') {
    handleLogin();
  }
  else if (a === 'do-request-access') {
    handleRequestAccess();
  }
  else if (a === 'logout') {
    logout();
  }
  else if (a === 'open-users-modal') {
    openUsersModal();
  }
  else if (a === 'approve-user') {
    approveUser(el.dataset.uid);
  }
  else if (a === 'reject-user') {
    rejectUser(el.dataset.uid);
  }
  else if (a === 'block-user') {
    blockUser(el.dataset.uid);
  }
  else if (a === 'toggle-admin') {
    toggleAdmin(el.dataset.uid);
  }
  else if (a === 'dashboard') { view = 'dashboard'; render(); }
  else if (a === 'pick') { view = 'picker'; render(); }
  else if (a === 'all') all();
  else if (a === 'start') start(el.dataset.type);
  else if (a === 'custom-builder') { view = 'builder'; render(); }
  else if (a === 'add-question') addQuestion();
  else if (a === 'remove-question') removeQuestion(el);
  else if (a === 'save-custom') saveCustom();
  else if (a === 'edit' && x) edit(x);
  else if (a === 'duplicate' && x) duplicateVisit(x);
  else if (a === 'remove' && x) removeVisit(x._id);
  else if (a === 'report' && x) { report = x; render(); }
  else if (a === 'close-report') { report = null; render(); }
  else if (a === 'print' || a === 'print-dashboard') window.print();
  else if (a === 'step') { sectionIdx = Number(el.dataset.step); render(); }
  else if (a === 'next' || a === 'prev') { sectionIdx += a === 'next' ? 1 : -1; render(); }
  else if (a === 'save') save(false);
  else if (a === 'finish') {
    let v = save(true);
    if (v) { report = v; render(); }
  }
  else if (a === 'export-excel') exportExcel();
  else if (a === 'export') {
    let blob = new Blob([JSON.stringify({
      format: 'atalat-visitas',
      version: 2,
      exportedAt: new Date().toISOString(),
      types: Object.entries(VISIT_TYPES).filter(([k]) => k.startsWith('custom_')).map(([id, t]) => ({ id, ...t })),
      visits
    }, null, 2)], { type: 'application/json' });
    let url = URL.createObjectURL(blob);
    let link = document.createElement('a');
    link.href = url;
    link.download = 'atalat-visitas-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup JSON exportado!');
  }
  else if (a === 'open-settings-modal') {
    openSettingsModal();
  }
  else if (a === 'import') $('#import-file').click();
  else if (a === 'load-demo') loadDemoData();
  else if (a === 'clear-search') { searchQuery = ''; render(); }
  else if (a === 'filter-type') { filterType = el.dataset.type; render(); }
  else if (a === 'dash-period') {
    if (el.dataset.period === 'current') dashboardMonth = new Date().toLocaleDateString('en-CA').slice(0, 7);
    else if (el.dataset.period === 'all') dashboardMonth = 'all';
    render();
  }
  else if (a === 'share-wa') {
    let item = visits.find(v => v._id === el.dataset.id) || report;
    if (item) openWhatsAppModal(item);
  }
  else if (a === 'force-sync') {
    syncWithSupabase(true);
  }
  else if (a === 'close-modal') {
    $('#modal-container').innerHTML = '';
  }
  else if (a === 'copy-wa') {
    let ta = $('#wa-text-area');
    if (ta) {
      ta.select();
      navigator.clipboard.writeText(ta.value).then(() => toast('Mensagem copiada para a área de transferência!'));
    }
  }
  else if (a === 'capture-gps') {
    captureGPS(el.dataset.field);
  }
  else if (a === 'toggle-password-visibility') {
    let targetId = el.dataset.target;
    let input = $('#' + targetId);
    if (input) {
      let isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      el.textContent = isPass ? '🙈' : '👁️';
      el.title = isPass ? 'Ocultar senha' : 'Visualizar senha';
    }
  }
});

window.addEventListener('beforeunload', e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

loadTypes();
load();
loadSession();
initSupabase();
render();

</script>
</body>
</html>
